#
# One node. Host ports 443 and 80 on 127.0.0.1 reach Traefik's NodePorts
# (traefik-values.yaml), so https://*.127-0-0-1.sslip.io lands on the Gateway.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443
        hostPort: 443
        listenAddress: 127.0.0.1
      - containerPort: 30080
        hostPort: 80
        listenAddress: 127.0.0.1
